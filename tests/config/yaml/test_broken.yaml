checkpoint: null
enable_profiling: "fish" # <- wrong type
system:
  num_cpu: 1
  num_gpu: 1
  distributed: False
model:
  cls_path: torch.nn.Linear
  args:
    - 1024
    - 128
  kwargs:
    bias: True
loss:
  cls_path: torch.nn.CrossEntropy
  args:
  kwargs:
trainer:
  cls_path: gloss.logging.timer.QuickTimer # <- Just a hack so the config compiles
  optimizer:
    cls_path: torch.optim.Adam
    kwargs:
      lr: 0.1
      betas:
        - 0.9
        - 0.99
  scheduler: null
  

